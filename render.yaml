services:
  - type: web
    name: madipro-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FALLBACK_TO_SQLITE
        value: "1"
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: madipro-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start

